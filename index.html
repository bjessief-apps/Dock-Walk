<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("dockwalk.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Dock Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dock-door board. Status-painted door plates run down the left of each card,
   a freight bar shows what's left in the trailer, and the crew bench is pinned to the bottom. */
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #efefeb;
  --line: #e3e3de;
  --line-2: #cdcdc6;
  --ink: #1a1a18;
  --ink-2: #4b4b46;
  --ink-3: #75756e;
  --accent: #dd9a32;
  --accent-ink: #1c1304;
  --accent-text: #8a5708;
  --accent-soft: #f8eedb;
  --ok: #2d7a58;
  --on-ok: #ffffff;
  --ok-soft: #e2efe8;
  --warn: #b0571b;
  --on-warn: #ffffff;
  --warn-soft: #f6e6d9;
  --wait: #46607e;
  --on-wait: #ffffff;
  --done-soft: #eaeae6;
  --bad: #b1342d;
  --on-bad: #ffffff;
  --freight: #c6a074;
  --freight-line: rgba(84, 58, 26, .28);
  --hazard: #1a1a18;
  --inverse: #1f1f1d;
  --on-inverse: #f3f3ef;
  --scrim: rgba(18, 18, 16, .42);
  --shadow-sm: 0 1px 2px rgba(20, 20, 16, .06);
  --shadow: 0 10px 30px rgba(20, 20, 16, .12), 0 2px 6px rgba(20, 20, 16, .06);
  --font-num: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-head: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1b1b19; --surface-2: #232321; --line: #2d2d2a; --line-2: #42423e;
    --ink: #ecece8; --ink-2: #b3b3ac; --ink-3: #85857e;
    --accent: #e8ab4c; --accent-ink: #1c1304; --accent-text: #efc27c; --accent-soft: #2c2416;
    --ok: #368a64; --on-ok: #ffffff; --ok-soft: #172720;
    --warn: #b9622a; --on-warn: #ffffff; --warn-soft: #31231a;
    --wait: #4f6d8f; --on-wait: #ffffff;
    --done-soft: #262623;
    --bad: #e6736a; --on-bad: #1d0705;
    --freight: #9b7a51; --freight-line: rgba(18, 11, 3, .45);
    --hazard: #0e0e0d; --inverse: #2b2b28; --on-inverse: #ecece8;
    --scrim: rgba(0, 0, 0, .6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow: 0 14px 36px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121211; --surface: #1b1b19; --surface-2: #232321; --line: #2d2d2a; --line-2: #42423e;
    --ink: #ecece8; --ink-2: #b3b3ac; --ink-3: #85857e;
    --accent: #e8ab4c; --accent-ink: #1c1304; --accent-text: #efc27c; --accent-soft: #2c2416;
    --ok: #368a64; --on-ok: #ffffff; --ok-soft: #172720;
    --warn: #b9622a; --on-warn: #ffffff; --warn-soft: #31231a;
    --wait: #4f6d8f; --on-wait: #ffffff;
    --done-soft: #262623;
    --bad: #e6736a; --on-bad: #1d0705;
    --freight: #9b7a51; --freight-line: rgba(18, 11, 3, .45);
    --hazard: #0e0e0d; --inverse: #2b2b28; --on-inverse: #ecece8;
    --scrim: rgba(0, 0, 0, .6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow: 0 14px 36px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html.locked { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }
h1, h2, h3, p, dl, dd { margin: 0; }
svg { display: block; }

/* ---------- frame ---------- */
#app { min-height: 100%; display: flex; flex-direction: column; overflow-x: clip; }
@supports not (overflow-x: clip) { .stage { overflow: hidden; } }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.tabs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.tab { height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-head); font-weight: 600; font-size: 15px; letter-spacing: -.01em; color: var(--ink-3); transition: color .15s, background .15s; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
.tab-badge { font-family: var(--font-num); font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); box-shadow: var(--shadow-sm); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.sm { width: 42px; height: 42px; border-radius: 11px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.view { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 28px; }
.view.has-bench { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }

/* ---------- buttons ---------- */
.btn { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 15px; letter-spacing: -.01em; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; box-shadow: var(--shadow-sm); transition: background .15s, border-color .15s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: transparent; box-shadow: none; }
.btn.danger-fill { background: var(--bad); color: var(--on-bad); border-color: var(--bad); }
.btn-big { width: 100%; min-height: 56px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-head); font-weight: 600; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: var(--shadow-sm); }
.btn-big.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.link { min-height: 44px; padding: 0 8px; color: var(--accent-text); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
.link.danger { color: var(--bad); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.muted { color: var(--ink-3); font-size: 14px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); font-size: 14px; line-height: 1.45; }
.banner > div { flex: 1 1 170px; min-width: 0; }
.banner .btn { flex: none; }

/* ---------- freight fill (pattern reads as stacked cartons) ---------- */
.freight { --c: 9px; background-color: var(--freight); background-image: linear-gradient(90deg, var(--freight-line) 1px, transparent 1px), linear-gradient(180deg, var(--freight-line) 1px, transparent 1px); background-size: var(--c) var(--c); }
.bx-big .freight { --c: 15px; }
.bx-small .freight { --c: 5px; }
.bx-mixed .freight { background-image: linear-gradient(90deg, var(--freight-line) 1px, transparent 1px), linear-gradient(180deg, var(--freight-line) 1px, transparent 1px), linear-gradient(90deg, var(--freight-line) 1px, transparent 1px); background-size: 15px 15px, 6px 7px, 6px 100%; }
.cbar .freight { --c: 17px; }
.cbar.bx-big .freight { --c: 30px; }
.cbar.bx-small .freight { --c: 9px; }
.cbar.bx-mixed .freight { background-size: 30px 30px, 11px 12px, 11px 100%; }

/* ---------- board ---------- */
.board-head { display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.shift-title { font-family: var(--font-head); font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
.shift-meta { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 6px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.fchip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.fchip[aria-pressed="true"] { background: var(--inverse); border-color: var(--inverse); color: var(--on-inverse); }
.fchip[aria-pressed="true"] b { color: var(--on-inverse); }
.fchip.add { border-style: dashed; border-color: var(--line-2); color: var(--accent-text); }
.fchip.add svg { width: 16px; height: 16px; }
.k { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.k-active { background: var(--ok); } .k-partial { background: var(--warn); } .k-full { background: var(--wait); }
.k-done { background: var(--ink-3); } .k-empty { border: 1px dashed var(--ink-3); }
.callout { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 12px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); font-weight: 500; font-size: 14px; text-align: left; }
.callout span:last-child { color: var(--accent-text); white-space: nowrap; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: 64px minmax(0, 1fr); min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; }
.plate { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 2px; background: var(--wait); color: var(--on-wait); }
.plate-num { font-family: var(--font-num); font-size: 24px; font-weight: 600; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.plate-st { font-family: var(--font-head); font-weight: 600; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.st-active .plate, .plate.st-active { background: var(--ok); color: var(--on-ok); }
.st-partial .plate, .plate.st-partial { background: var(--warn); color: var(--on-warn); }
.st-full .plate, .plate.st-full { background: var(--wait); color: var(--on-wait); }
.st-done .plate, .plate.st-done { background: var(--done-soft); color: var(--ink-3); }
.st-empty .plate { background: transparent; color: var(--ink-3); border-right: 2px dashed var(--line-2); }
.plate.st-empty { background: transparent; color: var(--ink-3); border: 2px dashed var(--line-2); }
.st-done, .st-empty { min-height: 0; }
.card-body { min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.mbar { display: flex; align-items: center; gap: 10px; }
.mbar-track { position: relative; flex: 1; height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.mbar-fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--left) * 1%); }
.mbar-val { min-width: 5.2em; text-align: right; font-family: var(--font-num); font-size: 13px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts { display: flex; flex-wrap: wrap; gap: 5px; }
.fact { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.fact.need { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.fact.flag { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.fact svg { width: 14px; height: 14px; }
.haz { width: 15px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--accent) 0 3px, var(--hazard) 3px 6px); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; }
.meter i { width: 3px; height: 10px; border-radius: 1px; background: var(--line-2); }
.meter i.on { background: var(--ink-2); }
.crew-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 8px; flex-wrap: wrap; }
.crew { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.time { margin-left: auto; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.done-crew { font-size: 14px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }
.empty-line { font-size: 15px; color: var(--ink-3); padding: 4px 0; }
.drop-slot { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--line-2); color: var(--ink-3); font-size: 13px; display: inline-flex; align-items: center; }
.card.drop-over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.card.drop-no { border-color: var(--bad); }
body.selecting .card.st-active, body.selecting .card.st-partial, body.selecting .card.st-full { border-color: var(--accent); border-style: dashed; }
body.selecting .card.st-active .drop-slot, body.selecting .card.st-partial .drop-slot, body.selecting .card.st-full .drop-slot { border-color: var(--accent); color: var(--ink); }

.chip { height: 34px; max-width: 10em; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.chip > span { overflow: hidden; text-overflow: ellipsis; }
.chip.on::before, .card .chip::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.lifting { opacity: .3; }
.chip.add { border-style: dashed; color: var(--accent-text); }
.chip small { color: var(--ink-3); font-weight: 600; font-size: 12px; }
.chip-x { width: 26px; height: 26px; margin-right: -6px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; line-height: 1; color: var(--ink-2); }
.chip.on { padding-right: 6px; }
.ghost { position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; box-shadow: var(--shadow); white-space: nowrap; }
body.dragging { user-select: none; -webkit-user-select: none; }

.bench { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(0, 0, 0, .06); transition: box-shadow .15s; }
.bench.drop-over { box-shadow: inset 0 0 0 3px var(--accent); }
.bench-label { flex: none; width: 46px; display: flex; flex-direction: column; align-items: center; font-family: var(--font-head); font-weight: 600; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); line-height: 1.15; }
.bench-label b { font-family: var(--font-num); font-size: 22px; font-weight: 600; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.bench-chips { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
.bench-chips::-webkit-scrollbar { display: none; }
.bench-chips .chip { flex: none; }
.bench-empty { color: var(--ink-3); font-size: 14px; }
.sel-hint { position: fixed; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 26; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--inverse); color: var(--on-inverse); border: 1px solid var(--line); font-size: 14px; box-shadow: var(--shadow); }
.sel-hint .link { color: var(--accent); }

.empty-state { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 8px; text-align: center; }
.empty-state h1 { font-family: var(--font-head); font-size: 26px; font-weight: 600; letter-spacing: -.025em; }
.empty-state p { color: var(--ink-2); max-width: 30ch; }
.empty-state .btn-big { max-width: 360px; }
.es-door { width: 150px; height: 120px; border-radius: 12px 12px 4px 4px; border: 1px solid var(--line-2); background: repeating-linear-gradient(180deg, var(--surface) 0 17px, var(--line) 17px 18px); display: grid; place-items: end center; padding-bottom: 8px; font-family: var(--font-num); font-weight: 600; font-size: 26px; letter-spacing: -.04em; color: var(--ink-3); box-shadow: var(--shadow-sm); }

/* ---------- walk ---------- */
.walk { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.strip-wrap { display: flex; flex-direction: column; gap: 6px; }
.strip-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.strip { position: relative; display: flex; align-items: center; gap: 5px; overflow-x: auto; margin-inline: -16px; padding: 4px 16px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.sd { flex: none; width: 48px; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); font-family: var(--font-num); font-weight: 500; font-size: 14px; letter-spacing: -.02em; color: var(--ink-3); background: transparent; }
.sd.s-none { background: var(--surface-2); border-color: var(--surface-2); color: var(--ink-3); opacity: .75; }
.sd.s-full { background: var(--wait); border-color: var(--wait); color: var(--on-wait); }
.sd.s-partial { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
.sd.s-active { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.sd.s-done { background: var(--done-soft); border-color: var(--done-soft); color: var(--ink-3); }
.sd.s-empty { border-style: dashed; color: var(--ink-2); }
.sd[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }
.strip-gap { flex: none; width: 3px; height: 24px; margin: 0 5px; border-radius: 2px; background: var(--line-2); }
.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.wcard { position: relative; flex: 1 1 auto; width: min(100%, 420px); min-height: 270px; max-height: 470px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 18px 52px; overflow: hidden; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
.wcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 34%; background: repeating-linear-gradient(180deg, transparent 0 21px, var(--line) 21px 22px); -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent); mask-image: linear-gradient(180deg, #000 40%, transparent); pointer-events: none; }
.wcard.dragging { transition: none; cursor: grabbing; }
.wcard.in { animation: cardIn .22s cubic-bezier(.2, .8, .2, 1); }

function unionSegs(segs) {

/* ---------- EOD report ---------- */
function buildReport(sh, opts) {
  const o = opts || {};
  const t = sh.endedAt || now();
  const cs = shiftContainers(sh).sort((a, b) => a.door - b.door);
  const done = cs.filter(c => c.doneAt);
  const newDone = done.filter(c => c.initialLeft >= 100);
  const rollDone = done.filter(c => c.initialLeft < 100);
  const started = c => c.firstStart || c.initialLeft < 100 || c.left < 100;
  const left = cs.filter(c => !c.doneAt && started(c));
  const waiting = cs.filter(c => !c.doneAt && !started(c));
  const e = sh.eod || {};
  const lumpers = e.lumpers != null ? e.lumpers : crewCount(sh);
  const labor = cs.reduce((a, c) => a + laborMs(c, t), 0);
  let pcs = 0, estimated = false, missing = 0;
  cs.forEach(c => {
    const total = c.actual != null ? c.actual : c.pieces;
    const share = c.doneAt ? c.initialLeft : (c.initialLeft - c.left);
    if (share <= 0) return;
    if (total == null) { missing++; return; }
    pcs += total * share / 100;
    if (share !== 100) estimated = true;
  });
  const touched = cs.filter(c => (c.doneAt ? c.initialLeft : c.initialLeft - c.left) > 0).length;
  const pcsTxt = touched === 0 ? '0' : (missing === touched ? '—' : (estimated || missing ? '≈' : '') + fmt(pcs));
  const avgList = newDone.map(c => workedMs(c, t)).filter(ms => ms > 0);
  const avgTxt = avgList.length ? dur(avgList.reduce((a, b) => a + b, 0) / avgList.length) : '—';
  const laborTxt = (Math.round(labor / 360000) / 10).toFixed(1);
  const L = [];
  L.push((S.settings.label || 'Shift') + ' EOD – ' + mdy(sh.startedAt));
  const extra = [];
  if (e.borrowed) extra.push(e.borrowed + ' borrowed');
  if (e.sentHome) extra.push(e.sentHome + ' sent home');
  L.push(plural(lumpers, 'Lumper', 'Lumpers') + (extra.length ? ' (' + extra.join(', ') + ')' : ''));
  L.push(plural(newDone.length, 'Container completed', 'Containers completed'));
  if (rollDone.length) L.push(plural(rollDone.length, 'Rollover finished', 'Rollovers finished'));
  const reasons = left.map(c => c.door + (c.note ? ' (' + c.note.split('\n')[0].trim().slice(0, 70) + ')' : ''));
  L.push(plural(left.length, 'Rollover left', 'Rollovers left') + (left.length ? ' – ' + reasons.join(', ') : ''));
  if (waiting.length) L.push(plural(waiting.length, 'Container not started', 'Containers not started'));
  if (e.osEpj != null) L.push(e.osEpj + ' OS EPJ');
  L.push('Notes: ' + (sh.note && sh.note.trim() ? sh.note.trim() : 'none'));
  if (o.details && cs.length) {
    L.push('');
    L.push('Doors:');
    cs.forEach(c => {
      const names = Array.from(new Set(c.segs.map(s => s.p))).map(pname).join(', ');
      const total = c.actual != null ? c.actual : c.pieces;
      const bits = [String(c.door)];
      if (c.doneAt) bits.push(c.initialLeft < 100 ? 'rollover finished' : 'done');
      else if (started(c)) bits.push('rollover left, ' + leftLabel(c.left));
      else bits.push('not started');
      bits.push(total != null ? fmt(total) + ' pcs' + (c.skus != null ? ' / ' + fmt(c.skus) + ' SKU' : '') : 'needs manifest');
      if (c.firstStart) bits.push(dur(workedMs(c, t)));
      if (names) bits.push(names);
      L.push(bits.join(' – '));
    });
    L.push('Pieces unloaded: ' + pcsTxt + ' · Labor: ' + laborTxt + ' hrs');
  }
  return {
    text: L.join('\n'),
    stats: { completed: newDone.length, rollDone: rollDone.length, rollLeft: left.length, waiting: waiting.length, pcsTxt, laborTxt, avgTxt, lumpers }
  };
}

/* ---------- walk ---------- */
const walkDoor = () => { const sh = S.shift; if (!sh) return null; const d = doorList()[sh.walkPos | 0]; return d == null ? null : d; };

  if (c && hasWork(c) && !c.doneAt) { render(); openSheet({ kind: 'clear', door }); return; }
  if (c && c.doneAt) sh.past.push(c);
  sh.doors[door] = { state: 'none', at: now(), c: null };
  sh.walkPos = (sh.walkPos | 0) + 1;
  UI.cardIn = true;
  vibrate(10);
  commit();
}

    ? { door, mode: 'walk', left: c.left, boxes: c.boxes, floor: c.floor, blind: c.blind }
    : { door, mode: 'walk', left: 100, boxes: null, floor: null, blind: false };
  vibrate(10);

}
function slipSave() {
  const d = UI.draft;
  const sh = S.shift;
  if (!d || !sh) return;
  const door = d.door;
  const t = now();
  let c = cAt(door);
  if (c && d.mode === 'board') { if (hasWork(c) || c.doneAt) sh.past.push(c); c = null; }
  else if (c && d.mode === 'walk' && c.doneAt) { sh.past.push(c); c = null; }
  if (!c) c = newContainer(door, d.mode === 'walk' ? 'walk' : 'board');
  const work = hasWork(c);

function bindWalk() {

    card.style.transform = x ? 'translateX(' + x + 'px) rotate(' + (x / 22) + 'deg)' : '';

/* ---------- container bar ---------- */
function bindBar(track) {
  const key = track.closest('.cbar').dataset.bar;
  let on = false, pid = null, val = +track.getAttribute('aria-valuenow');
  const pct = x => {
    const r = track.getBoundingClientRect();
    let p = Math.round(((x - r.left) / r.width * 100) / 5) * 5;
    if (p > 97) p = 100;
    if (p < 3) p = 0;
    return clamp(p, 0, 100);
  };
  const show = v => {
    const cb = track.closest('.cbar');
    track.style.setProperty('--left', v);
    track.setAttribute('aria-valuenow', v);
    track.setAttribute('aria-valuetext', leftLabel(v));
    cb.querySelector('.cbar-read-v').textContent = leftLabel(v);
    cb.querySelector('.cbar-read-s').textContent = v > 0 && v < 100 ? (100 - v) + '% done' : '';
  };
  track.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    on = true; pid = e.pointerId;
    try { track.setPointerCapture(pid); } catch (err) { /* ignore */ }
    track.classList.add('dragging');
    val = pct(e.clientX); show(val);
    e.preventDefault();
  });
  track.addEventListener('pointermove', e => {
    if (!on || e.pointerId !== pid) return;
    const v = pct(e.clientX);
    if (v !== val) { val = v; show(v); if (v % 25 === 0) vibrate(5); }
  });
  const end = () => { if (!on) return; on = false; track.classList.remove('dragging'); setBar(key, val); };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  track.addEventListener('keydown', e => {
    const cur = +track.getAttribute('aria-valuenow');
    let v = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') v = cur + 5;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') v = cur - 5;
    else if (e.key === 'Home') v = 0;
    else if (e.key === 'End') v = 100;
    if (v == null) return;
    e.preventDefault(); e.stopPropagation();
    v = clamp(v, 0, 100); show(v); setBar(key, v);
    const again = $('.cbar-track'); if (again) again.focus();
  });
}

/* ---------- moving people ---------- */
function moveTo(pid, where) {
  const sh = S.shift;
  if (!sh) return;
  const t = now();
  const from = doorOf(pid);
  const name = pname(pid);
  if (where === 'bench') {
    UI.sel = null;
    if (from != null) {
      const fc = cAt(from);
      unassign(fc, pid, t);
      commit();
      toast(fc.workers.length ? name + ' is on the bench' : name + ' is on the bench. Door ' + from + ' is partial now.');
    } else render();
    return;
  }
  const door = +where;
  const c = cAt(door);
  if (!c || c.doneAt || c.empty) { UI.sel = null; render(); toast('Door ' + door + ' is not open for work.'); return; }
  if (from === door) { UI.sel = null; render(); return; }
  if (c.workers.length >= MAX_ON_DOOR) { toast('Door ' + door + ' already has ' + MAX_ON_DOOR + ' people.'); return; }
  const fc = from != null ? cAt(from) : null;
  if (fc) unassign(fc, pid, t);
  assign(c, pid, t);
  if (!sh.crew.includes(pid)) sh.crew.push(pid);
  UI.sel = null;
  vibrate(8);
  commit();

}

  if (!c) return;
  const t = now();
  const prev = { workers: c.workers.slice(), left: c.left, id: c.id };
  prev.workers.forEach(p => unassign(c, p, t));
  c.doneAt = t;
  c.left = 0;
  UI.confirm = null;
  UI.sheets = [];
  commit();
  toast('Door ' + door + ' done in ' + dur(workedMs(c, t)), {
    label: 'Undo',
    fn: () => {
      const cc = cAt(door);
      if (!cc || cc.id !== prev.id) return;
      cc.doneAt = null; cc.left = prev.left;
      const t2 = now();
      prev.workers.forEach(p => { if (doorOf(p) == null) assign(cc, p, t2); });
      commit();
    }

}

/* drag a name: press and hold on touch, or just drag with a mouse */

  clearTimeout(s.timer);
  D.s = null;
  if (s.armed) endDragVisuals(s);
}
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { cancelDrag(); return; }
  const chip = e.target.closest('.chip[data-from]');
  if (!chip) return;
  const t = e.touches[0];
  dragStart(chip, t.clientX, t.clientY, false);
}, { passive: true });
document.addEventListener('touchmove', e => {
  const s = D.s;
  if (!s || s.mouse) return;
  const t = e.touches[0];
  if (s.armed && e.cancelable) e.preventDefault();
  dragMove(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchend', e => {
  const s = D.s;
  if (!s || s.mouse) return;
  if (s.armed && e.cancelable) e.preventDefault();
  dragEnd();
}, { passive: false });
document.addEventListener('touchcancel', cancelDrag);
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || D.s) return;
  const chip = e.target.closest('.chip[data-from]');
  if (!chip) return;
  dragStart(chip, e.clientX, e.clientY, true);
});
document.addEventListener('mousemove', e => {
  if (!D.s || !D.s.mouse) return;
  dragMove(e.clientX, e.clientY);
  if (D.s && D.s.armed) e.preventDefault();
});
document.addEventListener('mouseup', () => { if (D.s && D.s.mouse) dragEnd(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.chip[data-from], .wcard')) e.preventDefault(); });

/* ---------- copy ---------- */
function copyText(text, el) {
  const fallback = () => {
    if (el) { const range = document.createRange(); range.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
    toast('Text selected. Press and hold it to copy.');
  };
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) { fallback(); return; }
    navigator.clipboard.writeText(text).then(() => toast('Copied. Paste it in the group chat.'), fallback);
  } catch (e) { fallback(); }
}

/* ---------- actions ---------- */
const A = {
  view(el) { UI.view = el.dataset.view; UI.sel = null; UI.confirm = null; saveUI(); render(); window.scrollTo(0, 0); const tEl = $('#toast-root .toast'); if (tEl) tEl.className = 'toast' + toastPlace(); },
  menu() { openSheet({ kind: 'menu' }); },
  'close-sheet'() { closeSheet(); },
  start() { startShift(); },
  'walk-none'() { walkNone(); },
  'walk-trailer'() { walkTrailer(); },
  'walk-back'() { const sh = S.shift; sh.walkPos = Math.max(0, (sh.walkPos | 0) - 1); UI.cardIn = true; commit(); },
  'walk-skip'() { const sh = S.shift; sh.walkPos = (sh.walkPos | 0) + 1; UI.cardIn = true; commit(); },
  'walk-jump'(el) { S.shift.walkPos = +el.dataset.i; UI.view = 'walk'; UI.cardIn = true; saveUI(); commit(); },
  'walk-restart'() { S.shift.walkPos = 0; UI.cardIn = true; commit(); window.scrollTo(0, 0); },
  'bar-set'(el) { const v = +el.dataset.v; if (el.dataset.bar === 'slip') { UI.draft.left = v; renderSheet(); } else setBar('door', v); },
  seg(el) {
    const key = el.dataset.key, v = el.dataset.v;
    if (key.startsWith('slip-')) { const f = key === 'slip-boxes' ? 'boxes' : 'floor'; UI.draft[f] = UI.draft[f] === v ? null : v; renderSheet(); return; }
    const c = cAt(topSheet().door);
    if (!c) return;
    const f = key === 'door-boxes' ? 'boxes' : 'floor';
    c[f] = c[f] === v ? null : v;
    commit();
  },
  'slip-blind'(el) { UI.draft.blind = el.checked; },
  'slip-save'() { slipSave(); },
  'door-blind'(el) { const c = cAt(topSheet().door); if (c) { c.blind = el.checked; persist(); render(); } },
  filter(el) { UI.filter = el.dataset.f; saveUI(); render(); },
  'open-door'(el) {
    const door = +el.dataset.door;
    if (UI.sel) { moveTo(UI.sel, door); return; }
    UI.confirm = null; UI.pickOpen = false;
    openSheet({ kind: 'door', door });
  },
  chip(el) { const pid = el.dataset.pid; UI.sel = UI.sel === pid ? null : pid; render(); },
  bench() { if (UI.sel) moveTo(UI.sel, 'bench'); },
  'sel-cancel'() { UI.sel = null; render(); },
  'add-door'() { openSheet({ kind: 'adddoor' }); },
  'add-pick'(el) {
    const door = +el.dataset.door;
    UI.draft = { door, mode: 'board', left: 100, boxes: null, floor: null, blind: false };
    UI.sheets.pop();
    openSheet({ kind: 'slip' });
  },
  'edit-trailer'() {
    const door = topSheet().door;
    const c = cAt(door);
    UI.draft = { door, mode: 'edit', left: 100, boxes: c ? c.boxes : null, floor: c ? c.floor : null, blind: c ? c.blind : false };
    UI.sheets.pop();
    openSheet({ kind: 'slip' });
  },
  crew() { UI.editPid = null; UI.rmPid = null; openFromMenu({ kind: 'crew' }); },
  'door-unassign'(el) { const door = topSheet().door; unassign(cAt(door), el.dataset.pid, now()); commit(); },
  'door-pick'() { UI.pickOpen = !UI.pickOpen; renderSheet(); },
  'door-assign'(el) { UI.pickOpen = false; moveTo(el.dataset.pid, topSheet().door); },
  numpad(el) {
    const s = topSheet();
    const c = cAt(s.door);
    const f = el.dataset.field;
    openSheet({ kind: 'numpad', door: s.door, field: f, val: c && c[f] != null ? String(c[f]) : '' });
  },
  'np-eod'(el) {
    const f = el.dataset.f;
    const sh = S.shift;
    let v = sh.eod[f];
    if (f === 'lumpers' && v == null) v = crewCount(sh);
    openSheet({ kind: 'numpad', door: null, field: f, val: v != null ? String(v) : '' });
  },
  np(el) {
    const s = topSheet();
    const k = el.dataset.k;
    if (k === 'C') s.val = '';
    else if (k === '⌫') s.val = s.val.slice(0, -1);
    else if (s.val.length < 6) s.val = (s.val === '0' ? '' : s.val) + k;
    const disp = $('#np-display');
    if (disp) disp.innerHTML = s.val ? fmt(+s.val) : '<span class="ph">0</span>';
  },
  'np-save'() {
    const s = topSheet();
    if (!s || s.kind !== 'numpad') return;
    const v = s.val === '' ? null : parseInt(s.val, 10);
    UI.sheets.pop();
    if (s.door == null) {
      const e = S.shift.eod;
      if (s.field === 'sentHome' || s.field === 'borrowed') e[s.field] = v || 0;
      else e[s.field] = v;
      commit();
      return;
    }
    const c = cAt(s.door);
    if (c) c[s.field] = v;
    if (s.then === 'complete') { completeDoor(s.door); return; }
    commit();
  },
  step(el) {
    const sh = S.shift;
    const f = el.dataset.f;
    const d = +el.dataset.d;
    const e = sh.eod;
    if (f === 'lumpers') { const base = e.lumpers != null ? e.lumpers : crewCount(sh); e.lumpers = Math.max(0, base + d); }
    else if (f === 'osEpj') { if (e.osEpj == null) e.osEpj = d > 0 ? 1 : null; else { const n = e.osEpj + d; e.osEpj = n < 0 ? null : n; } }
    else e[f] = Math.max(0, (e[f] || 0) + d);
    commit();
  },
  confirm(el) { const s = topSheet(); UI.confirm = { kind: el.dataset.kind, door: s ? s.door : null }; render(); },
  'confirm-cancel'() { UI.confirm = null; render(); },
  complete(el) {
    const door = topSheet().door;
    if (el.dataset.mode === 'adjust') {
      const c = cAt(door);
      const start = c.actual != null ? c.actual : c.pieces;
      UI.confirm = null;
      openSheet({ kind: 'numpad', door, field: 'actual', val: start != null ? String(start) : '', then: 'complete' });
    } else completeDoor(door);
  },
  reopen() { const c = cAt(topSheet().door); if (!c) return; c.doneAt = null; commit(); },
  pulled() {
    const sh = S.shift;
    const door = topSheet().door;
    const c = cAt(door);
    if (c && (hasWork(c) || c.doneAt)) sh.past.push(c);
    sh.doors[door] = { state: 'none', at: now(), c: null };
    UI.sheets = []; UI.confirm = null;
    commit();
    toast('Door ' + door + ' is open');
  },
  remove() {
    const sh = S.shift;
    const door = topSheet().door;
    const c = cAt(door);
    if (c) c.workers.slice().forEach(p => unassign(c, p, now()));
    sh.doors[door] = { state: 'none', at: now(), c: null };
    UI.sheets = []; UI.confirm = null;
    commit();
    toast('Door ' + door + ' is off the board');
  },
  'clear-door'() {
    const sh = S.shift;
    const door = topSheet().door;
    const c = cAt(door);
    if (c) { c.workers.slice().forEach(p => unassign(c, p, now())); if (hasWork(c)) sh.past.push(c); }
    sh.doors[door] = { state: 'none', at: now(), c: null };
    sh.walkPos = (sh.walkPos | 0) + 1;
    UI.sheets = []; UI.cardIn = true;
    commit();
  },
  'add-person'() {
    const inp = $('#new-name');
    const name = (inp ? inp.value : '').trim().replace(/\s+/g, ' ').slice(0, 24);
    if (!name) { if (inp) inp.focus(); return; }
    if (activeRoster().some(p => p.name.toLowerCase() === name.toLowerCase())) { toast(name + ' is already on the roster.'); return; }
    const p = { id: 'p' + rid(), name };
    S.roster.push(p);
    if (S.shift && !S.shift.crew.includes(p.id)) S.shift.crew.push(p.id);
    UI.focusNewName = true;
    commit();
  },
  'toggle-here'(el) {
    const sh = S.shift;
    if (!sh) return;
    const pid = el.dataset.pid;
    if (sh.crew.includes(pid)) {
      const d = doorOf(pid);
      if (d != null) unassign(cAt(d), pid, now());
      sh.crew = sh.crew.filter(x => x !== pid);
      if (UI.sel === pid) UI.sel = null;
    } else sh.crew.push(pid);
    commit();
  },
  'edit-person'(el) { UI.editPid = el.dataset.pid; UI.rmPid = null; renderSheet(); },
  rename(el) {
    const p = person(el.dataset.pid);
    const inp = $('#edit-name');
    const name = (inp ? inp.value : '').trim().replace(/\s+/g, ' ').slice(0, 24);
    if (p && name) p.name = name;
    UI.editPid = null;
    commit();
  },
  'rm-ask'(el) { UI.rmPid = el.dataset.pid; renderSheet(); },
  'rm-cancel'() { UI.rmPid = null; renderSheet(); },
  'rm-person'(el) {
    const pid = el.dataset.pid;
    const p = person(pid);
    if (!p) return;
    const d = doorOf(pid);
    if (d != null) unassign(cAt(d), pid, now());
    if (S.shift) S.shift.crew = S.shift.crew.filter(x => x !== pid);
    S.lastCrew = S.lastCrew.filter(x => x !== pid);
    p.removed = true;
    if (UI.sel === pid) UI.sel = null;
    UI.editPid = null; UI.rmPid = null;
    commit();
  },
  history() { openFromMenu({ kind: 'history' }); },
  report(el) { openFromMenu({ kind: 'report', id: el.dataset.id, full: false }); },
  settings() { UI.confirm = null; UI.restoreOpen = false; openFromMenu({ kind: 'settings' }); },
  help() { openFromMenu({ kind: 'help' }); },
  'backup-copy'() {
    if (S.sample) { toast('This is the sample. Start your shift first.'); return; }
    copyText(JSON.stringify(S), null);
  },
  theme(el) { setTheme(el.dataset.t); renderSheet(); },
  'restore-open'() { UI.restoreOpen = !UI.restoreOpen; renderSheet(); },
  restore() {
    const inp = $('#restore-text');
    const data = safeParse(inp ? inp.value.trim() : '');
    if (!data || data.v !== 1) { toast('That doesn\'t look like a Dock Walk backup.'); return; }
    S = normalize(data);
    S.sample = false;
    UI.sheets = []; UI.restoreOpen = false; UI.sel = null; UI.confirm = null;
    commit();
    S.history.forEach(h => Sync.pushShift(h));
    toast('Backup restored');
  },
  wipe() {
    const label = S.settings;
    S = freshState();
    S.settings = Object.assign({}, label);
    UI.sheets = []; UI.confirm = null; UI.sel = null; UI.view = 'board';
    commit();
    Sync.wipeRemote();
    toast('Everything is deleted');
  },
  'eod-details'(el) { UI.eodDetails = el.checked; if (S.shift) updateReport(); else render(); },
  'copy-report'() { const el = $('#report-text'); if (el) copyText(el.textContent, el); },
  'copy-hist'() { const el = $('#hist-text'); if (el) copyText(el.textContent, el); },
  'hist-details'(el) { const s = topSheet(); s.full = el.checked; renderSheet(); },
  'end-shift'() { endShift(); },
  'toast-act'() { const fn = UI.toastAct; $('#toast-root').innerHTML = ''; UI.toastAct = null; if (fn) fn(); }
};

document.addEventListener('click', e => {
  if (now() < UI.suppressUntil) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, e);
}, true);
document.addEventListener('keydown', e => {
  const s = topSheet();
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (e.key === 'Escape' && s) { closeSheet(); return; }
  if (s && s.kind === 'numpad' && !typing) {
    if (/^\d$/.test(e.key)) { A.np({ dataset: { k: e.key } }); e.preventDefault(); }
    else if (e.key === 'Backspace') { A.np({ dataset: { k: '⌫' } }); e.preventDefault(); }
    else if (e.key === 'Enter') { A['np-save'](); e.preventDefault(); }
    return;
  }
  if (e.target.id === 'new-name' && e.key === 'Enter') { e.preventDefault(); A['add-person'](); return; }
  if (e.target.id === 'edit-name' && e.key === 'Enter') { e.preventDefault(); A.rename({ dataset: { pid: UI.editPid } }); return; }
  if (!s && UI.view === 'walk' && !typing && S.shift) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); walkNone(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); walkTrailer(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('article[data-act]')) { e.preventDefault(); A['open-door'](e.target); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'note') { const c = cAt(+el.dataset.door); if (c) { c.note = el.value; persistSoon(); } }
  else if (el.dataset.input === 'shift-note' && S.shift) { S.shift.note = el.value; persistSoon(); updateReport(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'set-label') { S.settings.label = el.value.trim() || DEFAULTS.label; commit(); }
  else if (el.id === 'set-ranges') {
    const d = parseDoors(el.value);
    if (!d.length) { toast('Couldn\'t read those doors. Try 101-120, 200-210.'); el.value = S.settings.ranges; return; }
    S.settings.ranges = el.value.trim();
    if (S.shift) S.shift.walkPos = Math.min(S.shift.walkPos | 0, d.length);
    commit();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (persistTimer) { clearTimeout(persistTimer); persistTimer = 0; persist(); }
    Sync.flush();
  } else {
    tick();
    Sync.pull(false);
    if (UI.view === 'walk') wantWake(!!S.shift && (S.shift.walkPos | 0) < doorList().length);
  }
});
window.addEventListener('pagehide', () => { if (persistTimer) { clearTimeout(persistTimer); persistTimer = 0; persist(); } Sync.flush(); });

render();
setInterval(tick, 20000);
Sync.init();
})();
</script>
